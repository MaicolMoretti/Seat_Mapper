<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seat Assignment Map</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js for Occupancy curve diagram -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- html2canvas and jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; margin: 0; }
        .canvas-container { position: relative; width: 100%; height: 100%; border-radius: 8px; overflow: hidden; background: #e5e7eb; display: flex; align-items: center; justify-content: center; }
        img.map-image { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
        canvas.overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: auto; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-slate-800">
    <div id="root" class="flex-1 flex flex-col"></div>
    <!-- Load our React App (with ngrok bypass) -->
    <script>
        fetch('/frontend/app.js', {
            headers: { 'ngrok-skip-browser-warning': 'true' }
        })
        .then(res => res.text())
        .then(code => {
            if (window.Babel) {
                try {
                    const transformed = window.Babel.transform(code, { presets: [['react', { runtime: 'classic' }]] }).code;
                    const script = document.createElement('script');
                    script.type = 'text/javascript';
                    script.textContent = transformed;
                    document.body.appendChild(script);
                } catch (bErr) {
                    console.error("Babel transform error:", bErr);
                    document.getElementById('root').innerHTML = '<div style="padding: 20px; color: red; font-weight: bold;">Error compiling app.js: ' + bErr.message + '</div>';
                }
            } else {
                console.error("Babel is not loaded!");
            }
        })
        .catch(err => console.error("Error loading app.js:", err));
    </script>
</body>
</html>
